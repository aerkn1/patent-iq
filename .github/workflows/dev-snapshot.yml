name: Dev Version Check

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  ensure-dev-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Check and ensure dev version
        run: |
          CURRENT_VERSION=$(poetry version -s)
          
          # If version doesn't end with .dev0, add it
          if [[ ! "$CURRENT_VERSION" =~ \.dev0$ ]]; then
            NEW_VERSION="${CURRENT_VERSION}.dev0"
            poetry version $NEW_VERSION
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml
            git commit -m "[aerkn1/patent-iq#1] - chore: ensure dev version suffix [skip ci]"
            git push origin dev
          else
            echo "Version already has .dev0 suffix: $CURRENT_VERSION"
          fi
