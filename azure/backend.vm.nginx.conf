server {
    listen 80;
    listen [::]:80;
    server_name api.patentiq.app;

    # Cloudflare Full (strict) still needs the origin to answer on HTTPS.
    # Keep HTTP only for bootstrap/troubleshooting and redirect to HTTPS once
    # the origin certificate is installed.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.patentiq.app;

    # Replace these paths with the Cloudflare Origin CA cert/key installed on the VM.
    ssl_certificate /etc/patentiq/certs/api.patentiq.app.pem;
    ssl_certificate_key /etc/patentiq/certs/api.patentiq.app.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
