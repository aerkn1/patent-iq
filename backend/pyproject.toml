    "pydantic (>=2.12.5,<3.0.0)",
    "requests (>=2.31.0,<3.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)",
    "numpy (>=1.26.0,<3.0.0)",
    "pandas (>=2.2.0,<3.0.0)",
    "lightgbm (>=4.0.0,<5.0.0)",
    "huggingface_hub (>=0.20.0,<1.0.0)",

