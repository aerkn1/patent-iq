[tool.poetry]
name = "patentiq-backend-v2"
version = "0.1.0"
description = "Clean V2 backend for PatentIQ"
authors = ["PatentIQ"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
duckdb = "^1.1.3"
pyarrow = "^18.0.0"
huggingface-hub = "^0.31.0"
transformers = "^4.49.0"
sentence-transformers = "^3.4.1"
torch = "^2.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
