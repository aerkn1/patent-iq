build:
  release_id: "mvp-local-build"
  year_window_start: 2007
  year_window_end: 2026
  heritage_backfill_start: 1996
  heritage_backfill_end: 2006
  snapshot_date: "2026-03-15"
  azure_publish_enabled: false
  vector_sample_pct: 0.1
  active_grant_only_for_semantic: true

sources:
  patstat_source_mode: "tip"
  register_source_mode: "tip"
  epab_source_mode: "tip"
  uspto_source_mode: "odp_api"
  refs_source_mode: "local_files"
  tip_env: "PROD"

execution:
  tip_chunked_export_enabled: true
  heritage_backfill_enabled: true
  blob_intermediate_enabled: true
  upload_after_chunk: true
  cleanup_after_upload: true
  tip_max_parallel_chunks: 2
  heritage_max_parallel_chunks: 3
  upload_max_concurrency: 2
  upload_max_block_size_mb: 4
  upload_max_single_put_size_mb: 8
  upload_connection_timeout_seconds: 60
  upload_read_timeout_seconds: 1200
  upload_retry_max_attempts: 3
  upload_retry_backoff_seconds: 5
  realtime_chunk_logging: true
  uspto_odp_api_key_env: "USPTO_ODP_API_KEY"
  uspto_odp_delay_seconds: 2.5
  uspto_odp_timeout_seconds: 600
  uspto_odp_max_retries: 5
  chunk_year_span: 2
  table_families:
    - "core"
    - "publications"
    - "legal"
    - "register"
    #- "epab"
    - "citations"
  heritage_table_families:
    - "core"
    - "publications"
    - "citations"
  max_workers:
    core: 2
    publications: 2
    legal: 1
    register: 1
    epab: 1
    citations: 1
  heritage_max_workers:
    core: 1
    publications: 1
    citations: 1
  local_limits:
    max_chunk_output_gb: 4
    max_temp_usage_gb: 20

paths:
  repo_root: ".."
  raw_patstat_dir: "etl/data/raw/patstat"
  raw_register_dir: "etl/data/raw/register"
  raw_uspto_dir: "etl/data/raw/uspto"
  raw_epab_dir: "etl/data/raw/epab"
  raw_refs_dir: "etl/data/raw/refs"
  bounded_patstat_dir: "etl/data/raw-bounded/patstat"
  bounded_register_dir: "etl/data/raw-bounded/register"
  bounded_uspto_dir: "etl/data/raw-bounded/uspto"
  bounded_epab_dir: "etl/data/raw-bounded/epab"
  bounded_refs_dir: "etl/data/raw-bounded/refs"
  bounded_seed_dir: "etl/data/raw-bounded/_seeds"
  bronze_dir: "etl/data/bronze"
  silver_dir: "etl/data/silver"
  gold_dir: "etl/data/gold"
  ml_dir: "etl/data/ml"
  vectors_dir: "etl/data/vectors"
  releases_dir: "etl/data/releases"
  manifests_dir: "etl/manifests"
  journal_path: "etl/ETL_IMPLEMENTATION_LOG.md"
  ref_techn_field_ipc: "data-analytics/cpc-coverage-data/ipc_to_wipo_industry.csv"

methods:
  method_version: "v2_mvp_local_etl"
  semantic_embedding_method: "stable_hash_embedding_mvp"
  semantic_ann_method: "manifest_only_placeholder"
