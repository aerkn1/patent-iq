[project]
name = "patentiq-etl"
version = "0.1.0"
description = "PatentIQ local ETL and artifact build pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.3,<2.0.0",
  "pyarrow>=20.0.0,<22.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "pydantic>=2.12.0,<3.0.0",
  "pandas>=2.3.0,<3.0.0",
  "SQLAlchemy>=2.0.40,<3.0.0",
  "azure-storage-blob>=12.26.0,<13.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
